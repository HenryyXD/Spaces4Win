name: Bug report
description: Something is broken or unexpected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in what you can — more detail = faster fix.
  - type: input
    id: version
    attributes:
      label: Spaces4Win version
      description: Release tag or commit hash
      placeholder: e.g. v0.1.0
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: elevated
    attributes:
      label: Were elevated (admin) windows involved?
      options:
        - "Not sure"
        - "No"
        - "Yes"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Monitor setup, Settings options, screenshots, etc.
